# ============================
# AV1 (libaom) — .webm slow
# ============================
[[codec]]
name = "AV1 (libaom)"
encoder = "libaom-av1"
container = "webm"

[codec.video]
format = "av1"
quality = "high | standard | low"

[codec.audio]
codec = "opus"
quality = "high | standard | low"



