# ============================================
# HLS H.264 — ABR Ladder
# ============================================
[[codec]]
name = "HLS H.264"
codec = "HLS H.264"
encoder = "libx264 | h264_qsv | h264_nvenc | h264_amf | h264_videotoolbox"
container = "m3u8"

[codec.video]
format = "8-bit 4:2:0"
quality = "ABR Ladder"

[codec.audio]
codec = "AAC"
quality = "128k"



# ============================================
# HLS HEVC 4K — 10-bit 4:2:0 HDR
# ============================================
[[codec]]
name = "HLS HEVC 4K"
codec = "HLS HEVC"
encoder = "libx265 | hevc_qsv | hevc_nvenc | hevc_amf | hevc_videotoolbox"
container = "m3u8"

[codec.video]
format = "10-bit 4:2:0"
quality = "4K HDR"

[codec.audio]
codec = "AAC"
quality = "192k"



